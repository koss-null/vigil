<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigil - cluster system monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body class="bg-solarized-base03 min-h-screen text-solarized-base0">
    <nav class="bg-solarized-base02 text-solarized-base3 shadow-lg">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold">Vigil</h1>
                <div class="flex space-x-4">
                    <a href="/" class="hover:text-solarized-blue px-3 py-2 rounded">Dashboard</a>
                    <a href="#" class="hover:text-solarized-blue px-3 py-2 rounded">Nodes</a>
                    <a href="#" class="hover:text-solarized-blue px-3 py-2 rounded">Services</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-6">
        <div id="dashboard">
            <div class="mb-6">
                <h2 class="text-3xl font-bold text-solarized-base1 mb-4">Cluster status</h2>
                <div id="summary-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
                    <!-- Loading placeholders -->
                    <div class="bg-solarized-base02 rounded-lg shadow p-4">
                        <div class="animate-pulse">
                            <div class="h-4 bg-solarized-base01 rounded w-1/2 mb-2"></div>
                            <div class="h-6 bg-solarized-base01 rounded w-3/4 mb-2"></div>
                            <div class="h-3 bg-solarized-base01 rounded w-2/3"></div>
                        </div>
                    </div>
                    <div class="bg-solarized-base02 rounded-lg shadow p-4">
                        <div class="animate-pulse">
                            <div class="h-4 bg-solarized-base01 rounded w-1/2 mb-2"></div>
                            <div class="h-6 bg-solarized-base01 rounded w-3/4 mb-2"></div>
                            <div class="h-3 bg-solarized-base01 rounded w-2/3"></div>
                        </div>
                    </div>
                    <div class="bg-solarized-base02 rounded-lg shadow p-4">
                        <div class="animate-pulse">
                            <div class="h-4 bg-solarized-base01 rounded w-1/2 mb-2"></div>
                            <div class="h-6 bg-solarized-base01 rounded w-3/4 mb-2"></div>
                            <div class="h-3 bg-solarized-base01 rounded w-2/3"></div>
                        </div>
                    </div>
                    <div class="bg-solarized-base02 rounded-lg shadow p-4">
                        <div class="animate-pulse">
                            <div class="h-4 bg-solarized-base01 rounded w-1/2 mb-2"></div>
                            <div class="h-6 bg-solarized-base01 rounded w-3/4 mb-2"></div>
                            <div class="h-3 bg-solarized-base01 rounded w-2/3"></div>
                        </div>
                    </div>
                </div>
                <div id="detailed-info" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Loading placeholders -->
                    <div class="bg-solarized-base02 rounded-lg shadow p-4">
                        <div class="animate-pulse">
                            <div class="h-5 bg-solarized-base01 rounded w-1/3 mb-4"></div>
                            <div class="h-3 bg-solarized-base01 rounded w-full mb-2"></div>
                            <div class="h-3 bg-solarized-base01 rounded w-5/6 mb-4"></div>
                            <div class="grid grid-cols-4 gap-2">
                                <div class="h-2 bg-solarized-base01 rounded"></div>
                                <div class="h-2 bg-solarized-base01 rounded"></div>
                                <div class="h-2 bg-solarized-base01 rounded"></div>
                                <div class="h-2 bg-solarized-base01 rounded"></div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-solarized-base02 rounded-lg shadow p-4">
                        <div class="animate-pulse">
                            <div class="h-5 bg-solarized-base01 rounded w-1/3 mb-4"></div>
                            <div class="h-3 bg-solarized-base01 rounded w-full mb-2"></div>
                            <div class="h-3 bg-solarized-base01 rounded w-5/6"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
